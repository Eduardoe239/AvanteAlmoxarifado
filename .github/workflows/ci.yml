name: CI

# Pipeline mínimo conforme seção 56 do Plano Mestre:
# checkout -> backend lint -> type/static checks -> pytest ->
# migrations (DB vazio + DB existente) -> frontend typecheck ->
# frontend build -> E2E -> security/dependency scan -> Docker build -> artifact
#
# E2E ainda não existe no repositório (passo 12 da Ordem Prática, seção 101)
# -- o job "e2e" abaixo está propositalmente marcado como placeholder até lá,
# em vez de simular uma etapa que hoje não faz nada.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  # database.py e auth.py exigem DATABASE_URL e SECRET_KEY já no import
  # (conftest faz `from main import app`), então precisam existir no job.
  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/almoxarifado_test
  DATABASE_URL_TEST: postgresql://postgres:postgres@localhost:5432/almoxarifado_test
  SECRET_KEY: ci-somente-teste-nao-usar-em-producao
  COOKIE_SECURE: "false"

jobs:
  backend-lint-and-static:
    name: Backend · lint + static checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Instalar dependências (dev)
        run: pip install -e ".[dev]"
      - name: Ruff (lint)
        run: ruff check . --select E9,F
      - name: Mypy (type checking -- modo permissivo, ver pyproject.toml)
        run: mypy . || true # F1-03: "quando aplicável" -- não bloqueia build ainda

  backend-tests:
    name: Backend · pytest (Postgres real)
    runs-on: ubuntu-latest
    needs: backend-lint-and-static
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: almoxarifado_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Instalar dependências
        run: pip install -e ".[dev]"
      - name: Rodar suíte de testes
        run: pytest -v

  migrations-check:
    name: Backend · migrations (DB vazio + DB existente)
    runs-on: ubuntu-latest
    needs: backend-lint-and-static
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: almoxarifado_migrations
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/almoxarifado_migrations
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e .
      - name: Upgrade em banco vazio
        run: alembic upgrade head
      - name: Downgrade 1 passo (valida reversibilidade da migration head)
        run: alembic downgrade -1
      - name: Upgrade novamente (DB "existente", não mais vazio)
        run: alembic upgrade head

  frontend-typecheck-and-build:
    name: Frontend · typecheck + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Instalar dependências (lockfile exato)
        run: npm ci
      - name: Typecheck (tsc --noEmit)
        run: npx tsc --noEmit
      - name: Lint
        run: npm run lint
      - name: Build de produção
        run: npm run build

  e2e:
    name: E2E (placeholder -- ainda não implementado)
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-typecheck-and-build]
    steps:
      - name: TODO -- Fase E2E (passo 12 da Ordem Prática)
        run: |
          echo "Nenhum teste E2E existe no repositório ainda."
          echo "Este job existe apenas para reservar o lugar no pipeline (seção 56)."
          echo "Substituir por Playwright/Cypress quando a Fase E2E começar."

  security-scan:
    name: Security / dependency scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: pip-audit (dependências Python)
        run: |
          pip install pip-audit
          pip-audit -r backend/requirements.txt || true # não bloqueia ainda; ver seção 78 (P1)
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: npm audit (dependências frontend)
        working-directory: frontend
        run: npm audit --audit-level=high || true

  docker-build:
    name: Docker build
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-typecheck-and-build]
    steps:
      - uses: actions/checkout@v4
      - name: Build imagem backend
        run: docker build -t avante-almoxarifado-backend:ci ./backend
      - name: Build imagem frontend
        run: docker build -t avante-almoxarifado-frontend:ci ./frontend
